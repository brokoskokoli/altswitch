# SPDX-License-Identifier: MIT
name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security problems:** please don't file them here – see [SECURITY.md](https://github.com/brokoskokoli/altswitch/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shortcut / hotkey
        - Window list or previews
        - Switching to a window
        - Layout (carousel / grid)
        - Permissions / setup assistant
        - Menu bar / settings
        - Installation
        - Performance
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AltSwitch version
      description: Menu bar icon → About, or the version of the DMG you installed
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and hardware
      placeholder: "macOS 15.5, MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed via
      options:
        - Download from GitHub Releases
        - Homebrew
        - Built from source
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Screenshots
      description: |
        Screenshots help a lot. Window previews show other apps' content – crop or blur anything private.
  - type: textarea
    id: logs
    attributes:
      label: Crash log or console output
      render: text
