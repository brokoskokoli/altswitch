# SPDX-License-Identifier: MIT
# REUSE compliance (https://reuse.software) for every push and pull request. Can also be a job
# inside the main CI workflow.
name: REUSE
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint
        run: pipx run --spec "reuse[charset-normalizer]==6.1.2" reuse lint   # pinned; raise deliberately
